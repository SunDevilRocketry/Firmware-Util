[project]
name = "Firmware-Util"
version = "2.0.0"
description = "SDR's Firmware Flashing & Setup Utility"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.0.0",
    "py7zr>=1.1.3",
    "requests>=2.33.0",
]

[dependency-groups]
build = [
    "pyinstaller>=6.16.0",
]
dev = [
    "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint.per-file-ignores]
"run_test.py" = ["F401"]
