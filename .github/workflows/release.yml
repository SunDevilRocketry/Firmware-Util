name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag for the release (e.g. v1.0.0-rc1)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  test:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check .

  build:
    name: Build (${{ matrix.id }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Add new rows here when supporting additional targets.
          - id: win64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group build

      - name: Build executable
        run: uv run python build.py

      - name: Stage release binary
        shell: bash
        run: cp dist/Firmware-Util.exe "Firmware-Util-${{ matrix.id }}.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: Firmware-Util-${{ matrix.id }}.exe
          if-no-files-found: error

  deliver:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
